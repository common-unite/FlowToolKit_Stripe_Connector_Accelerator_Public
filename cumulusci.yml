minimum_cumulusci_version: '3.79.0'
project:
    name: cUnite_Stripe_Connector_Accelerator
    package:
        name: "Flow Tool Kit: Stripe Connector Accelerator"
        namespace: FlowToolKit
        api_version: '65.0'
    dependencies:
        - github: 'https://github.com/common-unite/Flow_Tool_Kit_Public'
        # package_name and version_number are display only (install still resolves by
        # version_id). Without them MetaDeploy shows "Install Unknown Package 04t...".
        # Names match what admins see under Installed Packages in Setup.
        - version_id: 04tRN000004ZhkXYAS
          package_name: "Stripe app for Salesforce Platform"
          version_number: "1.25.0.1"
        - version_id: 04t4x0000003MzaAAE
          package_name: "Stripe Universal Connector Extension (2022-11-15)"
          version_number: "1.0.1.1"
    git:
    source_format: sfdx

plans:
    # MetaDeploy plans. Frozen steps carry options, checks and ui_options only, so
    # ignore_failure never reaches the worker: every step must succeed on its own.
    # Gates sit on task steps because checks on a flow step are dropped at freeze time.
    install:
        slug: install
        title: Install the Stripe Connector Accelerator
        tier: primary
        preflight_message: "Installs the Stripe Connector Accelerator together with the packages it depends on. Have your Stripe account ready: you connect it after the install finishes."
        post_install_message: "The Stripe Connector Accelerator is installed. Next, connect Stripe to Salesforce by following Stripe's installation guide at https://docs.stripe.com/use-stripe-apps/stripe-app-for-salesforce/installation-guide, then assign the Form Flow Payments User permission set to everyone who will build or use payment forms. Start with the Overview at https://github.com/common-unite/FlowToolKit_Stripe_Connector_Accelerator_Public/blob/main/docs/OVERVIEW.md and the Implementation Guide at https://github.com/common-unite/FlowToolKit_Stripe_Connector_Accelerator_Public/blob/main/docs/TECHNICAL_REFERENCE.md. The package is free in sandboxes and scratch orgs. Production use needs a one-time activation at https://common-unite.my.site.com/s/stripe-accelerator."
        checks:
            - when: "not tasks.check_lws_enabled()['is_enabled']"
              action: error
              message: "Lightning Web Security (LWS) must be enabled. Go to Setup > Session Settings and enable 'Use Lightning Web Security for Lightning web components'. Without LWS the payment forms degrade badly on large datasets."
            - when: "not tasks.check_enhanced_email()['is_enabled']"
              action: error
              message: "Enhanced Email must be enabled. Go to Setup > Enhanced Email to enable it. Flow Tool Kit requires Enhanced Email as a package dependency."
            - when: "tasks.check_stripe_connector_installed()['is_installed']"
              action: warn
              message: "The Stripe Connector Accelerator is already installed in this org. To move to a newer version, use the Upgrade plan instead."
        steps:
            1:
                flow: dependencies
                ui_options:
                    description: "Installs Flow Tool Kit, Stripe Flow Payments and the Stripe Universal Connector Extension at the versions this release was built against. Packages the org already has at that version are skipped."
            2:
                task: install_managed
                ui_options:
                    description: "Installs the Stripe Connector Accelerator managed package: the payment forms, the Stripe payment components and the supporting flows. Skipped automatically if this exact version is already installed."
            3:
                task: update_admin_profile
                ui_options:
                    description: "Grants the System Administrator profile access to the Stripe Connector Accelerator objects, fields, Apex classes and pages. The package ships with permissions closed, so admins need this to configure payment forms right after install. Safe to re-run."

    upgrade:
        slug: upgrade
        title: Upgrade the Stripe Connector Accelerator
        tier: additional
        preflight_message: "Upgrades the Stripe Connector Accelerator and its dependencies to the latest version. Your forms, form templates and permission sets are not touched."
        post_install_message: "The Stripe Connector Accelerator is upgraded. Your forms, form templates and permission sets were not changed. Release notes for every version are at https://github.com/common-unite/FlowToolKit_Stripe_Connector_Accelerator_Public/releases, and the Implementation Guide at https://github.com/common-unite/FlowToolKit_Stripe_Connector_Accelerator_Public/blob/main/docs/TECHNICAL_REFERENCE.md covers anything new."
        checks:
            - when: "not tasks.check_stripe_connector_installed()['is_installed']"
              action: error
              message: "The Stripe Connector Accelerator is not installed in this org yet. Run the Install plan instead."
            - when: "not tasks.check_lws_enabled()['is_enabled']"
              action: error
              message: "Lightning Web Security (LWS) must be enabled. Go to Setup > Session Settings and enable 'Use Lightning Web Security for Lightning web components'."
        steps:
            1:
                task: update_dependencies
                ui_options:
                    description: "Upgrades Flow Tool Kit, Stripe Flow Payments and the Stripe Universal Connector Extension to the versions this release was built against, where the org is behind."
            2:
                task: install_managed
                ui_options:
                    description: "Upgrades the Stripe Connector Accelerator managed package. Skipped automatically if this exact version is already installed."
            3:
                task: update_admin_profile
                ui_options:
                    description: "Grants the System Administrator profile access to anything new in this version. Safe to re-run."

tasks:

    # Preflight checks for the MetaDeploy plans. Vendored into tasks/ because the worker
    # runs stock CumulusCI and imports only from this repo, not cci_flowtoolkit_tasks.
    check_lws_enabled:
        class_path: tasks.check_lws_enabled.CheckLWSEnabled
        description: Preflight - is Lightning Web Security enabled?

    check_enhanced_email:
        class_path: tasks.check_enhanced_email.CheckEnhancedEmailEnabled
        description: Preflight - is Enhanced Email enabled?

    check_stripe_connector_installed:
        class_path: tasks.check_package_installed.CheckPackageInstalled
        description: Preflight - is the Stripe Connector Accelerator already installed? Queried by package name because the package shares the FlowToolKit namespace with the base.
        options:
            package_name: "Flow Tool Kit: Stripe Connector Accelerator"

    export_form:
        class_path: cci_flowtoolkit_tasks.export_form.ExportFormMetadata

    github_copy_subtree:
        options:
            repo_url: "https://github.com/common-unite/FlowToolKit_Stripe_Connector_Accelerator_Public"
            branch: "main"
            create_release: true
            release_body: true
            include: [ "cumulusci.yml","sfdx-project.json","orgs/","README.md","docs/","tasks/" ]

    robot:
        options:
            suites: robot/cUnite_Stripe_Connector_Accelerator/tests
            options:
                outputdir: robot/cUnite_Stripe_Connector_Accelerator/results

    robot_testdoc:
        options:
            path: robot/cUnite_Stripe_Connector_Accelerator/tests
            output: robot/cUnite_Stripe_Connector_Accelerator/doc/cUnite_Stripe_Connector_Accelerator_tests.html

    run_tests:
        options:
            required_org_code_coverage_percent: 75

    scan_csv:
        description: Scan a CSV file for a specific value
        class_path: tasks.ScanCSVTask.ScanCSVTask
        options:
            csv_file_path: myFile.csv
            value_to_scan: Book

flows:

    dev_org:
        steps:
            4.5:
                task: assign_permission_sets
                options:
                    api_names: Form_Builder_Admin,Form_Flow_User,Form_Flow_Payments_User
                ignore_failure: True
            5:
                task: deploy
                options:
                    path: force-app-form-templates
            6:
                task: deploy
                options:
                    path: site
            7:
                task: create_community
                options:
                    name: Stripe Marketing
                    template: Build Your Own
                    url_path_prefix: stripe
                    skip_existing: True
                    timeout: 120
            8:
                task: deploy
                options:
                    path: site-experiences
            9:
                task: publish_community
                options:
                    name: Stripe Marketing

    site_dev_org:
        description: Lightweight org for designing and testing site marketing components (no dependencies, no Apex)
        steps:
            1:
                task: deploy
                options:
                    path: site
            2:
                task: create_community
                options:
                    name: Stripe Marketing
                    template: Build Your Own
                    url_path_prefix: stripe
                    skip_existing: True
                    timeout: 120
            3:
                task: deploy
                options:
                    path: site-experiences-local
            4:
                task: publish_community
                options:
                    name: Stripe Marketing

    npc_dev_org:
        description: Set up an NPC scratch org with Grantmaking, OmniStudio, Action Plans, and Experience Cloud
        steps:
            1:
                flow: dependencies
            2:
                flow: deploy_unmanaged
            3:
                task: deploy
                options:
                    path: force-app-form-templates
            4:
                task: deploy
                options:
                    path: site
            5:
                task: assign_permission_sets
                options:
                    api_names: Form_Builder_Admin,Form_Flow_User,Form_Flow_Payments_User
                ignore_failure: True
            6:
                task: assign_permission_set_licenses
                options:
                    api_names: OmniStudioPsl,ActionPlansPsl,GrantmakingUserPsl,FundraisingAccessPsl,ProgramAndBenefitManagementPsl,DynamicAssessmentsPsl
                ignore_failure: True
            7:
                task: assign_permission_sets
                options:
                    api_names: OmniStudioAdmin,ActionPlans,GrantmakingManager,FundraisingAccess,ProgramAndBenefitManagementAccess,DynamicAssessmentAccess,GroupMembership,DataPipelinesBaseUser,DocumentChecklist
                ignore_failure: True
            8:
                task: create_community
                options:
                    name: Stripe Marketing
                    template: Build Your Own
                    url_path_prefix: stripe
                    skip_existing: True
                    timeout: 120
            9:
                task: deploy
                options:
                    path: site-experiences
            10:
                task: publish_community
                options:
                    name: Stripe Marketing
            11:
                task: snapshot_changes

    release_2gp_beta:
        steps:
            90:
                task: github_copy_subtree
                options:
                    tag_name: "latest_beta"


    release_2gp_production:
        steps:
            90:
                task: github_copy_subtree
                options:
                    tag_name: "latest"

    testing:
        steps:
            1:
                task: scan_csv
            2:
                task: log
                options:
                    line: $org_config.found

orgs:
    scratch:
        dev:
            config_file: orgs/dev.json
            days: 30
            namespaced: True
        dev_unnamespaced:
            config_file: orgs/dev.json
            days: 30
            namespaced: False
        site:
            config_file: orgs/site.json
            days: 7
            namespaced: False
        npc:
            config_file: orgs/npc.json
            days: 7
            namespaced: True
